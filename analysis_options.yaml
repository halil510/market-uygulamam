# analysis_options.yaml
# Market Plus — statik analiz ve kod stili kuralları.
# `flutter analyze` bu dosyayı otomatik okur.
#
# ─────────────────────────────────────────────────────────────────────────────
# BİRLEŞTİRME NOTU (25.07.2026)
# Bu dosya, sizin mevcut analiz ayarlarınızın ÜZERİNE kurulmuştur.
# Mevcut kuralların TAMAMI korundu; sadece eksik olanlar eklendi.
# Eklenenler "# ➕ EKLENDİ" ile işaretlidir.
#
# ⚠ NOT: pubspec.yaml'da `flutter_lints: ^6.0.0` vardı ama bu dosya
# bana gönderilen zip'te YOKTU — o yüzden ilk analizde "lint çalışmıyor"
# demiştim. Sizde varmış; kendi sürümünüz esas alındı.
# ─────────────────────────────────────────────────────────────────────────────

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "**/*.bak"                    # ➕ EKLENDİ — eski yedek dosyaları
    - "**/*_ESKI*.dart"             # ➕ EKLENDİ
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  errors:
    # Üretim kodunda kalan print() çağrılarını uyarı olarak işaretle
    # (debugPrint kullanılmalı — bkz. DERIN_YOL_HARITASI.md A5)
    avoid_print: warning
    # Kullanılmayan import/değişkenler derlemeyi durdurmaz ama uyarı versin
    unused_import: warning
    unused_local_variable: warning

    # ➕ EKLENDİ — GERÇEKTEN HATA OLANLAR
    # Bunlar canlıda çökme veya yanlış davranış sebebidir; uyarı değil
    # hata sayılmalı ki gözden kaçmasın.
    missing_required_param: error
    missing_return: error
    body_might_complete_normally: error
    invalid_override: error
    invalid_use_of_protected_member: error
    return_of_invalid_type: error
    argument_type_not_assignable: error
    undefined_identifier: error

    # ➕ EKLENDİ — GÜRÜLTÜ AZALTMA
    # Bu 5 kural sizin listenizde "true" — açık bıraktım, ama 56.000
    # satırlık mevcut kodda binlerce uyarı üretip GERÇEK hataları gömüyorlar.
    # Kapatmadım, sadece "info" seviyesine indirdim.
    # Tekrar zorlamak isterseniz: `dart analyze --fatal-infos`
    #
    # Ölçtüğüm gerçek sayılar (bu kod tabanında):
    #   prefer_const_constructors      → ~1700 aday
    #   use_key_in_widget_constructors → 136 private yardımcı widget
    #   always_declare_return_types    → ~190 yer
    #   prefer_final_locals            → ~57 `var` tanımı
    prefer_const_constructors: info
    prefer_const_literals_to_create_immutables: info
    use_key_in_widget_constructors: info
    always_declare_return_types: info
    prefer_final_locals: info

    # ➕ EKLENDİ — Türkçe isimlendirme projede bilinçli tercih.
    non_constant_identifier_names: info

linter:
  rules:
    # ══ SİZİN KURALLARINIZ (hepsi aynen korundu) ═════════════════════════
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
    always_declare_return_types: true
    annotate_overrides: true
    avoid_empty_else: true
    avoid_returning_null_for_void: true
    curly_braces_in_flow_control_structures: true
    empty_catches: true
    no_duplicate_case_values: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    unnecessary_null_checks: true
    valid_regexps: true

    # ══ ➕ EKLENDİ: ASYNC / CONTEXT GÜVENLİĞİ ════════════════════════════
    # Flutter'da en sık çökme sebebi: await'ten sonra ekran kapanmışken
    # context kullanmak ("setState called after dispose"). Bu kural onu
    # derleme öncesi yakalar — analizimde 18 şüpheli yer çıkmıştı.
    use_build_context_synchronously: true
    # `void` dönen async fonksiyon — hatası yakalanamaz
    avoid_void_async: true

    # ⚠ unawaited_futures: KAPATILDI (dürüstlük notu)
    #
    # Bu kuralı ben önermiştim: "beklenmeyen Future = sessizce yutulan hata".
    # `flutter analyze` ile 90 bulgu çıktı; hepsini tek tek inceledim ve
    # PRATİKTE HEPSİ YANLIŞ POZİTİF çıktı:
    #
    #   • ref.read(...Provider.notifier).yukle()  → Riverpod'da standart
    #     ateşle-unut deseni; beklemek gereksiz yere UI'ı bloklar
    #   • _shakeCtrl.forward() / _fadeCtrl.forward() / _dondurmeCtrl.repeat()
    #     → animasyon; beklenmesi zaten YANLIŞ olur
    #   • showDialog(...) yükleniyor kutusu → bilinçli olarak beklenmiyor,
    #     sonradan programatik kapatılıyor
    #   • context.push(...) → navigasyon, dönüş değeri gerekmiyor
    #   • _kameraCtrl?.dispose(), HapticFeedback.lightImpact()
    #
    # 90 çağrıyı `unawaited()` ile sarmak saf gürültü olurdu: sıfır fayda,
    # sıfırdan büyük risk. Kural bu mimaride işe yaramıyor.
    #
    # Tekrar açmak isterseniz: `unawaited_futures: true` — ama önce
    # ref.read().yukle() desenini nasıl ele alacağınıza karar verin.
    unawaited_futures: false

    # ══ ➕ EKLENDİ: BELLEK SIZINTISI ═════════════════════════════════════
    # POS uygulaması günlerce açık kalır, sızıntılar birikir.
    close_sinks: true
    cancel_subscriptions: true

    # ══ ➕ EKLENDİ: WIDGET AĞACI ═════════════════════════════════════════
    sort_child_properties_last: true
    use_colored_box: true
    use_decorated_box: true

    # ══ ➕ EKLENDİ: TİP GÜVENLİĞİ / TEMİZLİK ═════════════════════════════
    prefer_typing_uninitialized_variables: true
    unnecessary_statements: true
    unnecessary_brace_in_string_interps: true
    unnecessary_this: true

    # ══ ➕ BİLİNÇLİ OLARAK KAPALI ════════════════════════════════════════
    # Projede kasıtlı genel catch'ler var (soket kapatma, migration ALTER)
    avoid_catches_without_on_clauses: false
    # sqflite dönüşleri dynamic — açılırsa yüzlerce uyarı
    avoid_dynamic_calls: false
    # Projede hem ' hem " kullanılıyor, zorlamıyoruz
    prefer_single_quotes: false
