<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Doğalora — Menü</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─────────── ÖZELLEŞTİRME ─────────── */
    :root {
      --ana-renk: #1A3A2A;        /* zengin koyu yeşil */
      --vurgu-renk: #D4AF37;      /* sıcak altın */
      --vurgu-yumusak: #E8D5A3;
      --arkaplan: #F7F4EE;        /* ince krem */
      --kart-bg: #FFFFFF;
      --yazi-koyu: #1F2A22;
      --yazi-acik: #6A7A6E;
      --golge: 0 12px 30px rgba(0, 20, 10, 0.10);
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--arkaplan);
      color: var(--yazi-koyu);
      padding-bottom: 120px;
      background-image: radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.03) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(26, 58, 42, 0.04) 0%, transparent 50%);
    }

    /* ─── HERO ─── */
    .hero {
      background: linear-gradient(145deg, #1A3A2A, #0F261C);
      color: white;
      padding: 48px 24px 56px;
      text-align: center;
      border-radius: 0 0 48px 48px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.20);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '🌿';
      position: absolute;
      font-size: 140px;
      opacity: 0.06;
      top: -30px;
      right: -20px;
      transform: rotate(12deg);
    }
    .hero::after {
      content: '✦';
      position: absolute;
      font-size: 40px;
      opacity: 0.08;
      bottom: 20px;
      left: 30px;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.25);
      position: relative;
      display: inline-block;
    }
    .hero h1::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -10px;
      transform: translateX(-50%);
      width: 70px;
      height: 3px;
      background: var(--vurgu-renk);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
    }
    .hero .alt-baslik {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.85;
      margin-top: 22px;
      color: var(--vurgu-yumusak);
    }
    .hero .dekor {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 18px;
      opacity: 0.5;
      letter-spacing: 6px;
    }

    /* ─── GRUP BAŞLIKLARI ─── */
    .grup {
      padding: 28px 24px 10px;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--ana-renk);
      display: flex;
      align-items: center;
      gap: 14px;
      letter-spacing: 0.3px;
    }
    .grup::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--vurgu-renk), transparent);
      opacity: 0.4;
    }

    /* ─── ÜRÜN KARTLARI ─── */
    .urun {
      background: var(--kart-bg);
      margin: 10px 18px;
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: var(--golge);
      transition: transform 0.2s ease, box-shadow 0.25s ease;
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(2px);
    }
    .urun:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(0, 20, 10, 0.12);
    }
    .urun-bilgi {
      flex: 1;
      min-width: 0;
    }
    .urun-ad {
      font-size: 17px;
      font-weight: 600;
      color: var(--yazi-koyu);
      letter-spacing: -0.2px;
    }
    .urun-aciklama {
      font-size: 13px;
      color: var(--yazi-acik);
      margin-top: 4px;
      line-height: 1.4;
      opacity: 0.8;
      padding-right: 8px;
    }
    .urun-fiyat {
      font-size: 16px;
      font-weight: 700;
      color: var(--vurgu-renk);
      margin-top: 6px;
      letter-spacing: 0.3px;
    }
    .urun-fiyat::before {
      content: '₺';
      margin-right: 2px;
      font-weight: 400;
      opacity: 0.7;
    }

    .miktar-kutu {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      background: var(--arkaplan);
      padding: 4px 8px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
    }
    .btn-yuvarlak {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--ana-renk);
      color: white;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 2px 8px rgba(26, 58, 42, 0.15);
    }
    .btn-yuvarlak:active { transform: scale(0.92); }
    .btn-yuvarlak:disabled {
      background: #D3D9D0;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .btn-yuvarlak:not(:disabled):hover { background: #2A5A3E; }
    .miktar-sayi {
      font-size: 17px;
      font-weight: 700;
      min-width: 22px;
      text-align: center;
      color: var(--yazi-koyu);
    }

    /* ─── SEPET ÇUBUĞU ─── */
    .sepet-cubuk {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--ana-renk);
      color: white;
      padding: 18px 24px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25);
      border-radius: 28px 28px 0 0;
      backdrop-filter: blur(8px);
      background: rgba(26, 58, 42, 0.94);
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }
    .sepet-cubuk.gorunur { display: flex; }
    .sepet-cubuk span {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .sepet-buton {
      background: var(--vurgu-renk);
      color: var(--ana-renk);
      border: none;
      border-radius: 40px;
      padding: 12px 28px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .sepet-buton:hover { transform: scale(1.02); box-shadow: 0 6px 24px rgba(212, 175, 55, 0.4); }

    /* ─── MODAL ─── */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 25, 18, 0.6);
      display: none;
      align-items: flex-end;
      z-index: 20;
      backdrop-filter: blur(6px);
      animation: fadeIn 0.3s ease;
    }
    .modal.acik { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-icerik {
      background: var(--kart-bg);
      width: 100%;
      border-radius: 32px 32px 0 0;
      padding: 28px 24px 32px;
      max-height: 82vh;
      overflow-y: auto;
      box-shadow: 0 -12px 40px rgba(0,0,0,0.15);
      animation: slideUp 0.35s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-icerik h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--ana-renk);
      margin-bottom: 18px;
      border-bottom: 2px solid var(--vurgu-yumusak);
      padding-bottom: 12px;
    }
    .sepet-satir {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #EFECE3;
      font-size: 15px;
    }
    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #E5E1D6;
      border-radius: 16px;
      font-size: 14px;
      margin-top: 10px;
      margin-bottom: 16px;
      font-family: 'Poppins', sans-serif;
      background: #FCFCF9;
      transition: border 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--ana-renk);
      background: white;
      box-shadow: 0 0 0 4px rgba(26, 58, 42, 0.08);
    }
    .gonder-btn {
      width: 100%;
      background: var(--ana-renk);
      color: white;
      border: none;
      border-radius: 40px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 20px rgba(26, 58, 42, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .gonder-btn:hover { transform: scale(1.01); box-shadow: 0 8px 28px rgba(26, 58, 42, 0.35); }
    .kapat-btn {
      width: 100%;
      background: transparent;
      color: var(--yazi-acik);
      border: none;
      padding: 14px;
      font-size: 14px;
      margin-top: 6px;
      cursor: pointer;
      opacity: 0.6;
    }
    .kapat-btn:hover { opacity: 1; }
    .basarili {
      text-align: center;
      padding: 50px 20px;
    }
    .basarili h2 {
      color: var(--ana-renk);
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin-top: 14px;
    }
    .yukleniyor, .hata-kutu {
      text-align: center;
      padding: 80px 20px;
      color: var(--yazi-acik);
      font-size: 15px;
    }
    .hata-kutu {
      background: #FFF2E6;
      border-radius: 20px;
      margin: 30px 20px;
      padding: 40px;
      color: #A65A3A;
    }

    /* ─── İLETİŞİM ─── */
    .iletisim {
      margin: 44px 18px 0;
      padding: 30px 24px;
      background: var(--kart-bg);
      border-radius: var(--radius);
      box-shadow: var(--golge);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.6);
    }
    .iletisim h3 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--ana-renk);
      margin-bottom: 16px;
    }
    .iletisim-satir {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      color: var(--yazi-acik);
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .iletisim-satir a {
      color: var(--ana-renk);
      text-decoration: none;
      font-weight: 500;
    }
    .sosyal {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 18px;
    }
    .sosyal a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--arkaplan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      text-decoration: none;
      color: var(--ana-renk);
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .sosyal a:hover {
      background: var(--ana-renk);
      color: white;
      transform: scale(1.05);
    }
    .alt-cizgi {
      text-align: center;
      font-size: 12px;
      color: var(--yazi-acik);
      padding: 24px 20px 10px;
      opacity: 0.5;
      letter-spacing: 0.5px;
    }

    /* ─── UFAK DÜZELTMELER ─── */
    @media (max-width: 480px) {
      .hero h1 { font-size: 44px; }
      .hero .alt-baslik { font-size: 13px; letter-spacing: 3px; }
      .urun { padding: 14px 16px; margin: 8px 12px; }
      .urun-ad { font-size: 15px; }
      .miktar-kutu { gap: 8px; padding: 2px 6px; }
      .btn-yuvarlak { width: 30px; height: 30px; font-size: 16px; }
      .sepet-cubuk { padding: 14px 18px; }
    }
  </style>
</head>
<body>

  <!-- ===== HERO ===== -->
  <div class="hero">
    <h1>Doğalora</h1>
    <div class="alt-baslik">Lezzetin Doğal Hâli</div>
    <div class="dekor">✦ ✦ ✦</div>
  </div>

  <!-- ===== MENÜ ALANI ===== -->
  <div id="menuAlani"><div class="yukleniyor">🌱 Menü yükleniyor…</div></div>

  <!-- ===== İLETİŞİM ===== -->
  <div class="iletisim" id="iletisimAlani"></div>
  <p class="alt-cizgi" id="altYazi"></p>

  <!-- ===== SEPET ÇUBUĞU ===== -->
  <div class="sepet-cubuk" id="sepetCubuk">
    <span id="sepetOzet">0 ürün · 0 ₺</span>
    <button class="sepet-buton" onclick="sepetiAc()">Sepeti Gör</button>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal" id="modal">
    <div class="modal-icerik">
      <div id="modalIcerik"></div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- JAVASCRIPT (Aynen korundu, sadece küçük bir düzeltme yapıldı) -->
  <!-- ============================================================ -->
  <script>
    // ═══════════════════════════════════════════════════════════════
    // ÖZELLEŞTİRME — İşletme adı, alt yazı ve iletişim bilgileri
    // ═══════════════════════════════════════════════════════════════
    const ISLETME_ADI = "DoğalOra";
    const ALT_YAZI = "Lezzetin Doğal Hâli";

    const ILETISIM = {
      adres: "Muğla Karayolu, Kale girişi, Denizli/KALE",
      telefon: "5550020005",
      instagram: "dogalora",
      calismaSaatleri: "Her gün 07:00 – 24:00"
    };

    // ═══════════════════════════════════════════════════════════════
    // SUPABASE BAĞLANTI BİLGİLERİ — kendi bilgilerinizle değiştirin
    // ═══════════════════════════════════════════════════════════════
    const SUPABASE_URL = "BURAYA_SUPABASE_URL_YAPISTIRIN";
    const SUPABASE_ANON_KEY = "BURAYA_ANON_KEY_YAPISTIRIN";

    // ─── Hero başlığını güncelle (JS ile) ───
    document.querySelector('.hero h1').textContent = ISLETME_ADI;
    document.querySelector('.hero .alt-baslik').textContent = ALT_YAZI;
    document.title = ISLETME_ADI + " — Menü";

    // ─── İletişim ve alt yazı ───
    document.getElementById('iletisimAlani').innerHTML =
      '<h3>Bize Ulaşın</h3>' +
      '<div class="iletisim-satir">📍 ' + ILETISIM.adres + '</div>' +
      '<div class="iletisim-satir">📞 <a href="tel:' + ILETISIM.telefon.replace(/\s/g,'') + '">' + ILETISIM.telefon + '</a></div>' +
      '<div class="iletisim-satir">🕒 ' + ILETISIM.calismaSaatleri + '</div>' +
      '<div class="sosyal"><a href="https://instagram.com/' + ILETISIM.instagram + '" target="_blank">📷</a></div>';
    document.getElementById('altYazi').textContent = '© ' + new Date().getFullYear() + ' ' + ISLETME_ADI;

    // ─── Masa ID ───
    const params = new URLSearchParams(window.location.search);
    const MASA_ID = parseInt(params.get('masa') || '0', 10);

    let urunler = [];
    let sepet = {};

    // ─── Verileri yükle ───
    async function yukle() {
      try {
        const r = await fetch(SUPABASE_URL + '/rest/v1/urunler?select=id,urun_adi,satis_fiyati,kdv_oran,ana_grup,alan1&is_deleted=eq.false&aktif=eq.true', {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
        });
        if (!r.ok) throw new Error('Sunucu hatası');
        const data = await r.json();
        urunler = data.map(u => ({
          id: u.id, ad: u.urun_adi, fiyat: parseFloat(u.satis_fiyati),
          kdv: parseFloat(u.kdv_oran) || 18, grup: u.ana_grup || 'Diğer',
          aciklama: u.alan1 || ''
        }));
        render();
      } catch (e) {
        document.getElementById('menuAlani').innerHTML =
          '<div class="hata-kutu">Menü yüklenemedi. Lütfen personelden yardım isteyin.</div>';
      }
    }

    // ─── Menüyü çiz ───
    function render() {
      const gruplar = {};
      urunler.forEach(u => { (gruplar[u.grup] = gruplar[u.grup] || []).push(u); });
      let html = '';
      for (const grup in gruplar) {
        html += '<div class="grup">' + grup + '</div>';
        gruplar[grup].forEach(u => {
          const adet = sepet[u.id] ? sepet[u.id].adet : 0;
          html += '<div class="urun">' +
            '<div class="urun-bilgi">' +
            '<div class="urun-ad">' + u.ad + '</div>' +
            (u.aciklama ? '<div class="urun-aciklama">' + u.aciklama + '</div>' : '') +
            '<div class="urun-fiyat">' + u.fiyat.toFixed(2) + ' ₺</div></div>' +
            '<div class="miktar-kutu">' +
            '<button class="btn-yuvarlak" onclick="degistir(' + u.id + ',-1)" ' + (adet===0?'disabled':'') + '>−</button>' +
            '<span class="miktar-sayi">' + adet + '</span>' +
            '<button class="btn-yuvarlak" onclick="degistir(' + u.id + ',1)">+</button>' +
            '</div></div>';
        });
      }
      document.getElementById('menuAlani').innerHTML = html;
      sepetCubuguGuncelle();
    }

    function degistir(urunId, delta) {
      const u = urunler.find(x => x.id === urunId);
      if (!sepet[urunId]) sepet[urunId] = { urun: u, adet: 0 };
      sepet[urunId].adet = Math.max(0, sepet[urunId].adet + delta);
      if (sepet[urunId].adet === 0) delete sepet[urunId];
      render();
    }

    function sepetCubuguGuncelle() {
      const adetler = Object.values(sepet);
      const toplamAdet = adetler.reduce((s, k) => s + k.adet, 0);
      const toplamTutar = adetler.reduce((s, k) => s + k.adet * k.urun.fiyat, 0);
      const cubuk = document.getElementById('sepetCubuk');
      if (toplamAdet > 0) {
        cubuk.classList.add('gorunur');
        document.getElementById('sepetOzet').textContent = toplamAdet + ' ürün · ' + toplamTutar.toFixed(2) + ' ₺';
      } else {
        cubuk.classList.remove('gorunur');
      }
    }

    function sepetiAc() {
      const adetler = Object.values(sepet);
      const toplam = adetler.reduce((s, k) => s + k.adet * k.urun.fiyat, 0);
      let satirlar = adetler.map(k =>
        '<div class="sepet-satir"><span>' + k.adet + 'x ' + k.urun.ad + '</span><span>' +
        (k.adet * k.urun.fiyat).toFixed(2) + ' ₺</span></div>').join('');
      document.getElementById('modalIcerik').innerHTML =
        '<h2>Siparişiniz</h2>' + satirlar +
        '<div class="sepet-satir" style="font-weight:700;border-bottom:none;padding-top:12px;">' +
        '<span>Toplam</span><span>' + toplam.toFixed(2) + ' ₺</span></div>' +
        '<input id="adSoyad" placeholder="Adınız (opsiyonel)">' +
        '<input id="not" placeholder="Sipariş notu (opsiyonel)">' +
        '<button class="gonder-btn" onclick="gonder()">Siparişi Gönder</button>' +
        '<button class="kapat-btn" onclick="kapat()">Vazgeç</button>';
      document.getElementById('modal').classList.add('acik');
    }

    function kapat() { document.getElementById('modal').classList.remove('acik'); }

    async function gonder() {
      const kalemler = Object.values(sepet).map(k => ({
        urun_id: k.urun.id, urun_adi: k.urun.ad, miktar: k.adet,
        birim_fiyat: k.urun.fiyat, kdv_oran: k.urun.kdv,
        not: document.getElementById('not').value
      }));
      const gövde = {
        masa_id: MASA_ID, kalemler: kalemler,
        musteri_adi: document.getElementById('adSoyad').value,
        musteri_tel: '', not_: document.getElementById('not').value,
        islendi: false
      };
      try {
        const r = await fetch(SUPABASE_URL + '/rest/v1/qr_siparisler', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + SUPABASE_ANON_KEY
          },
          body: JSON.stringify(gövde)
        });
        if (r.ok) {
          document.getElementById('modalIcerik').innerHTML =
            '<div class="basarili"><div style="font-size:52px;">✅</div>' +
            '<h2>Siparişiniz Alındı!</h2><p style="margin-top:8px;color:#6A7A6E;">Teşekkür ederiz, hazırlanıyor.</p></div>';
          sepet = {}; render();
          setTimeout(kapat, 2500);
        } else { alert('Bir hata oluştu, lütfen personelden yardım isteyin.'); }
      } catch (e) { alert('Bağlantı hatası, lütfen personelden yardım isteyin.'); }
    }

    // ─── Başlat ───
    if (MASA_ID > 0) { yukle(); }
    else {
