name: market_plus
description: Profesyonel Market Yönetim Sistemi
publish_to: 'none'
version: 2.3.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    

  # ── NAVİGASYON & STATE ────────────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.17.1
  go_router: ^18.0.2
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  cross_file: ^0.3.4+1
  google_generative_ai: ^0.4.3

  # ── VERİTABANI ────────────────────────────────────────────────────────────
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2

  # ── BARKOD / KAMERA ────────────────────────────────────────────────────────
  mobile_scanner: ^7.4.2
  speech_to_text: ^7.0.0
  xml: ^6.5.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  barcode: ^2.2.8
  image_picker: ^1.1.2
  image: ^4.2.0
  permission_handler: ^13.0.2

  # ── YAZICI / BLUETOOTH ────────────────────────────────────────────────────
  # 1.x BSD lisanslı; 2.0.0 tek değişiklikle (lisans) ücretli ticari lisansa geçti
  # ve derlemede telemetri gönderiyor — ticari kullanım için 1.x'te kalınıyor.
  flutter_blue_plus: ^1.36.8
  esc_pos_utils_plus: ^2.0.4
  # USB termal yazıcı desteği (Android USB Host API üzerinden CDC-ACM/seri)
  usb_serial:
    # Yerel kopya: pub.dev sürümü (0.5.2, son) jcenter() kullandığı için
    # Gradle 9 ile derlenmiyor — bkz. packages/usb_serial/android/build.gradle.
    path: packages/usb_serial

  # ── DOSYA & EXPORT ────────────────────────────────────────────────────────
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.2
  archive: ^3.6.1
  share_plus: ^13.3.0
  file_picker: ^13.1.0
 
  # ── GRAFİK ────────────────────────────────────────────────────────────────
  fl_chart: ^1.2.0

  # ── UI ────────────────────────────────────────────────────────────────────
  shimmer: ^4.0.0
  flutter_staggered_grid_view: ^0.7.0
  cupertino_icons: ^1.0.8

  # ── HTTP & API ────────────────────────────────────────────────────────────
  dio: ^5.8.0+1
  http: ^1.2.1  

  # ── MAIL ──────────────────────────────────────────────────────────────────
  mailer: ^7.2.0

  # ── YARDIMCILAR ───────────────────────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.1

  # ── SES & BİLDİRİM ───────────────────────────────────────────────────────
  audioplayers: ^6.1.0
  vibration: ^3.1.3
  flutter_local_notifications: ^22.3.1

  # ── HATA İZLEME (crash reporting) ─────────────────────────────────────────
  sentry_flutter: ^9.30.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_launcher.png"
  adaptive_icon_background: "#4361EE"
  adaptive_icon_foreground: "assets/icons/ic_launcher.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo.png
    - assets/images/logoYazı.png
    - assets/images/splash.png
    - assets/images/placeholder.png
    - assets/images/excel_icon.png
    - assets/images/pdf_icon.png
    - assets/images/empty_box.png
    - assets/images/no_internet.png
    - assets/icons/ic_launcher.png
    - assets/sounds/bip.mp3
    - assets/templates/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700