name: market_plus
description: Profesyonel Market Yönetim Sistemi
publish_to: 'none'
version: 2.3.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    

  # ── NAVİGASYON & STATE ────────────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_commons: ^0.11.1
  go_router: ^13.2.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  cross_file: ^0.3.4+1
  google_generative_ai: ^0.4.3

  # ── VERİTABANI ────────────────────────────────────────────────────────────
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # ── BARKOD / KAMERA ────────────────────────────────────────────────────────
  mobile_scanner: ^7.2.0
  speech_to_text: ^7.0.0
  xml: ^6.5.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  barcode: ^2.2.8
  image_picker: ^1.1.2
  image: ^4.2.0
  permission_handler: ^12.0.0+1

  # ── YAZICI / BLUETOOTH ────────────────────────────────────────────────────
  flutter_blue_plus: ^1.33.0
  esc_pos_utils_plus: ^2.0.4
  # USB termal yazıcı desteği (Android USB Host API üzerinden CDC-ACM/seri)
  usb_serial: ^0.5.2

  # ── DOSYA & EXPORT ────────────────────────────────────────────────────────
  excel: ^4.0.6
  csv: ^6.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  open_filex: ^4.7.0
  archive: ^3.6.1
  share_plus: ^10.0.3
  file_picker: ^8.0.0
 
  # ── GRAFİK ────────────────────────────────────────────────────────────────
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^30.2.6
  syncfusion_flutter_datagrid: ^30.2.6
  syncfusion_flutter_datepicker: ^30.2.6

  # ── UI ────────────────────────────────────────────────────────────────────
  shimmer: ^3.0.0
  flutter_slidable: ^4.0.0
  flutter_staggered_grid_view: ^0.7.0
  badges: ^3.1.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.0
  country_pickers: ^3.0.1
  cupertino_icons: ^1.0.8

  # ── HTTP & API ────────────────────────────────────────────────────────────
  dio: ^5.8.0+1
  retrofit: ^4.7.2
  json_annotation: ^4.9.0
  http: ^1.2.1  

  # ── MAIL & OAUTH (YENİ) ──────────────────────────────────────────────────
  mailer: ^6.1.0
  googleapis: ^13.0.0
  googleapis_auth: ^1.6.0
  oauth2: ^2.0.0

  # ── WEBVIEW (YENİ) ────────────────────────────────────────────────────────
  webview_flutter: ^4.8.0

  # ── FORM ──────────────────────────────────────────────────────────────────
  form_builder_validators: ^11.2.0

  # ── YARDIMCILAR ───────────────────────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  logger: ^2.6.0
  connectivity_plus: ^6.0.5
  device_info_plus: ^10.1.0
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.12

  # ── SES & BİLDİRİM ───────────────────────────────────────────────────────
  audioplayers: ^6.1.0
  vibration: ^3.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.3.2
  json_serializable: ^6.8.0
  retrofit_generator: ^9.7.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_launcher.png"
  adaptive_icon_background: "#4361EE"
  adaptive_icon_foreground: "assets/icons/ic_launcher.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo.png
    - assets/images/logoYazı.png
    - assets/images/splash.png
    - assets/images/placeholder.png
    - assets/images/excel_icon.png
    - assets/images/pdf_icon.png
    - assets/images/empty_box.png
    - assets/images/no_internet.png
    - assets/icons/ic_launcher.png
    - assets/sounds/bip.mp3
    - assets/templates/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700