// usb_serial 0.5.2 (pub.dev, son sürüm 2024-07) — BarkoPro için yerel kopya.
// Tek değişiklik bu dosya (2026-09-29): Gradle 9 jcenter()'ı kaldırdı ve
// orijinal dosya jcenter + AGP 4.1 buildscript kullandığı için derleme
// kırılıyordu. Dart/Java kodu birebir aynı. Kaynak:
// https://github.com/altera2015/usbserial (BSD lisansı, bkz. LICENSE).
group 'dev.bessems.usbserial'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'dev.bessems.usbserial'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // felHR85/UsbSerial yalnız JitPack'te — depo kök build.gradle.kts'de
    // yalnız bu grup için tanımlı.
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
}
